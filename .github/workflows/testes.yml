name: Testes de código
on: [push, pull_request]
jobs:
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      # Integração com microdados e modelo salvo é verificada localmente.
      - run: python -m pytest -q tests/test_protocolo.py -k 'not modelo_historico' -p no:cacheprovider
